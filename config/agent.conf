<!--
  Centralized agent config (pushed to all agents in the "default" group)
  Location on manager: /var/ossec/etc/shared/default/agent.conf
  Adds 3 Windows log sources the agent does NOT collect by default.
-->
<agent_config>
  <!-- Sysmon: process creation, network connections, file creation, registry -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- PowerShell operational log -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Microsoft Defender: without this, Defender blocks are invisible to the SOC -->
  <localfile>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
</agent_config>
